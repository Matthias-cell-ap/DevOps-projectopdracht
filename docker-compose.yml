services:
  memos:
    image: neosmemo/memos:26.11.1
    restart: unless-stopped
    ports:
      - "5230:5230"
    volumes:
      - ./data/memos:/var/opt/memos
    environment:
      MEMOS_PORT: 5230
      MEMOS_DRIVER: sqlite
      MEMOS_INSTANCE_URL: http://localhost:5230

  info:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./info:/usr/share/nginx/html:ro

  gatus:
    image: twinproduction/gatus:v5.38.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/gatus:/config:ro
      - ./data/gatus:/data/

  schautrack:
    image: ghcr.io/schaurian/schautrack:2.9.1
    env_file: schautrack.env
    ports:
      - "3000:3000"
    depends_on:
      schautrack-db:
        condition: service_healthy
    networks:
      - default 
      - schautrack-db-internal
    restart: unless-stopped

  schautrack-db:
    image: postgres:18-alpine
    env_file: schautrack.env
    networks:
      - schautrack-db-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - schautrack-db-data:/var/lib/postgresql
    restart: unless-stopped
  
  gym:
    build: ./gym
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - default
  
  gym-api:
    build: ./gym/server
    env_file: gym.env
    restart: unless-stopped
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - default 
      - gym-db-internal
  
  gym-db:
    image: postgres:18-alpine
    env_file: gym.env
    networks:
      - gym-db-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - gym-db-data:/var/lib/postgresql
    restart: unless-stopped
volumes:
  schautrack-db-data:
  gym-db-data:

networks:
  schautrack-db-internal:
    internal: true
  gym-db-internal:
    internal: true