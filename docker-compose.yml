services:
  memos:
    image: neosmemo/memos:26.11.1
    restart: unless-stopped
    volumes:
      - ./data/memos:/var/opt/memos
    environment:
      MEMOS_PORT: 5230
      MEMOS_DRIVER: sqlite
      MEMOS_INSTANCE_URL: http://localhost:5230
    labels:
      - traefik.enable=true
      - traefik.http.routers.notes.rule=Host(`notes.matthias-gym-app.duckdns.org`)
      - traefik.http.routers.notes.entrypoints=websecure
      - traefik.http.services.notes.loadbalancer.server.port=5230
      - traefik.http.routers.notes.middlewares=authelia@docker


  info:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.info.rule=Host(`info.matthias-gym-app.duckdns.org`)
      - traefik.http.routers.info.entrypoints=websecure
      - traefik.http.services.info.loadbalancer.server.port=80
    volumes:
      - ./info:/usr/share/nginx/html:ro

  gatus:
    image: twinproduction/gatus:v5.38.0
    restart: unless-stopped
    volumes:
      - ./config/gatus:/config:ro
      - ./data/gatus:/data/
    labels:
      - traefik.enable=true
      - traefik.http.routers.status.rule=Host(`status.matthias-gym-app.duckdns.org`)
      - traefik.http.routers.status.entrypoints=websecure
      - traefik.http.services.status.loadbalancer.server.port=8080
      - traefik.http.routers.status.middlewares=authelia@docker


  schautrack:
    image: ghcr.io/schaurian/schautrack:2.9.1
    env_file: schautrack.env
    depends_on:
      schautrack-db:
        condition: service_healthy
    networks:
      - default 
      - schautrack-db-internal
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.food.rule=Host(`food.matthias-gym-app.duckdns.org`)
      - traefik.http.routers.food.entrypoints=websecure
      - traefik.http.services.food.loadbalancer.server.port=3000
      - traefik.http.routers.food.middlewares=authelia@docker


  schautrack-db:
    image: postgres:18-alpine
    env_file: schautrack.env
    networks:
      - schautrack-db-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - schautrack-db-data:/var/lib/postgresql
    restart: unless-stopped
  
  gym:
    build: ./gym
    restart: unless-stopped
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.gym.rule=Host(`gym.matthias-gym-app.duckdns.org`)
      - traefik.http.routers.gym.entrypoints=websecure
      - traefik.http.services.gym.loadbalancer.server.port=80
      - traefik.http.routers.gym.middlewares=authelia@docker

  
  gym-api:
    build: ./gym/server
    env_file: gym.env
    restart: unless-stopped
    depends_on:
      gym-db:
        condition: service_healthy
    networks:
      - default 
      - gym-db-internal
  
  gym-db:
    image: postgres:18-alpine
    env_file: gym.env
    networks:
      - gym-db-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - gym-db-data:/var/lib/postgresql
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: traefik.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      default:
        aliases:
          - auth.matthias-gym-app.duckdns.org

  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
    volumes:
      - ./config/authelia:/config
      - ./secrets/authelia:/secrets:ro
      - ./data/authelia:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`auth.matthias-gym-app.duckdns.org`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.services.authelia.loadbalancer.server.port=9091
      - traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true
      - traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name

volumes:
  schautrack-db-data:
  gym-db-data:
  traefik-certs:

networks:
  schautrack-db-internal:
    internal: true
  gym-db-internal:
    internal: true