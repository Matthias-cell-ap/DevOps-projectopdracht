version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories: ["/", "/vps"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/gym", "/gym/server"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: ["/gym", "/gym/server"]
    schedule:
      interval: weekly