services:
  tunnel:
    image: nginx:1.31.8-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
  backup-server:
    image: restic/rest-server:0.14.0
    restart: unless-stopped
    ports:
      - "100.125.246.114:8000:8000"
    volumes:
      - /srv/restic:/data